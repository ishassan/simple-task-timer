# Builds the web version (web/) and puts it on Firebase Hosting:
# simple-task-timer-e196ff.web.app.
# It signs in to Google Cloud with Workload Identity Federation, with no key:
# GitHub gives the run a short-lived token, and Google lets runs from this
# repository act as the service account github-web-deploy (roles Firebase
# Hosting Admin and API Keys Viewer). The pool "github" and its provider
# "simple-task-timer" accept only this repository (see web/README.md).
name: Web deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # the token that Workload Identity Federation exchanges

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Make the Firebase bundle (app/lib/firebase.js)
        working-directory: firebase
        run: npm ci && npm run bundle

      - name: Run the unit tests
        run: node --test

      - name: Make the web version (firebase/hosting)
        working-directory: firebase
        run: npm run web

      # Writes a credentials file and sets GOOGLE_APPLICATION_CREDENTIALS,
      # which the Firebase CLI reads
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/427469644050/locations/global/workloadIdentityPools/github/providers/simple-task-timer
          service_account: github-web-deploy@simple-task-timer-e196ff.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        working-directory: firebase
        run: npx firebase deploy --only hosting --non-interactive
