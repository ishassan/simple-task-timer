# Runs the unit tests, then runs the add-on in headless Firefox: the task
# buttons, Undo, the goal, the badge and the optional notification, and the
# update from 3.11.0.
name: Goal test

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'firefox/**'
      - 'firebase/package*.json'
      - 'firebase/bundle-entry.js'
      - 'tests/**'
      - '.github/workflows/goal-test.yml'

jobs:
  goal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the update test needs the tag v3.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Make the Firebase bundle (app/lib/firebase.js)
        working-directory: firebase
        run: npm ci && npm run bundle

      - name: Make the add-on (firefox/build)
        run: node firefox/build.mjs

      - name: Run the unit tests
        run: node --test

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install Selenium
        run: pip install selenium

      - name: Run the test
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: python3 firefox/tests/goal_test.py

      - name: Run the update test
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: python3 firefox/tests/update_test.py
