<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Task Timer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5.5h3.5v13H7zM13.5 5.5H17v13h-3.5z" fill="currentColor"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M5.5 12a6.5 6.5 0 1 0 2-4.7M5 4.5v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-done" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-delete" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <form id="new-task" autocomplete="off">
    <input id="name" type="text" maxlength="200" aria-label="Task name" enterkeyhint="go">
    <button id="start" type="submit" class="primary">
      <svg class="i" aria-hidden="true"><use href="#i-play"/></svg>Start
    </button>
  </form>

  <div id="notify-prompt" hidden>
    <span>Get a desktop alert when a goal is reached.</span>
    <span class="actions">
      <button id="notify-on" type="button" class="primary">Turn on</button>
      <button id="notify-later" type="button">Not now</button>
    </span>
  </div>

  <p id="empty" hidden>Press Enter to start timing.</p>
  <ul id="list"></ul>

  <details id="done-group" hidden>
    <summary><span id="done-title">Done</span><button id="delete-done" type="button" class="link">Delete all</button></summary>
    <ul id="done-list"></ul>
  </details>

  <div id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="undo" type="button" class="link">Undo</button>
  </div>

  <template id="row-template">
    <li class="task">
      <div class="line">
        <span class="name"></span>
        <span class="time"></span>
        <button type="button" class="icon toggle"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg></button>
        <button type="button" class="icon reset" title="Reset" aria-label="Reset"><svg class="i" aria-hidden="true"><use href="#i-reset"/></svg></button>
        <button type="button" class="icon done" title="Done" aria-label="Done"><svg class="i" aria-hidden="true"><use href="#i-done"/></svg></button>
        <button type="button" class="icon delete" title="Delete" aria-label="Delete"><svg class="i" aria-hidden="true"><use href="#i-delete"/></svg></button>
      </div>
      <div class="goal" hidden><div class="bar"><div class="fill"></div></div><span class="goal-text"></span></div>
    </li>
  </template>

  <template id="edit-template">
    <form class="edit" autocomplete="off" novalidate>
      <label>Name <input name="name" type="text" maxlength="200"></label>
      <label>Time <input name="time" type="text" placeholder="0:25:00" enterkeyhint="done"></label>
      <label>Goal <input name="goal" type="text" placeholder="None" enterkeyhint="done"></label>
      <div class="chips">
        <button type="button" data-goal="15m">15m</button>
        <button type="button" data-goal="25m">25m</button>
        <button type="button" data-goal="45m">45m</button>
        <button type="button" data-goal="1h">1h</button>
        <button type="button" data-goal="">None</button>
        <button type="submit" class="primary save">Save</button>
      </div>
      <p class="error" hidden></p>
    </form>
  </template>

  <template id="done-template">
    <li class="task is-done">
      <div class="line">
        <span class="name"></span>
        <span class="time"></span>
        <button type="button" class="icon toggle" title="Start again" aria-label="Start again"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg></button>
        <button type="button" class="icon delete" title="Delete" aria-label="Delete"><svg class="i" aria-hidden="true"><use href="#i-delete"/></svg></button>
      </div>
    </li>
  </template>

  <script src="tasks.js"></script>
  <script src="store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
